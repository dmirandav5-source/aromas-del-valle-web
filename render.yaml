# Blueprint de Render: un solo servicio web de Node (API + frontend compilado).
services:
  - type: web
    name: aromas-del-valle
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PIN
        sync: false # se pide al crear el Blueprint; déjalo vacío para que la edición quede abierta
